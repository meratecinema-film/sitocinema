services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: myapp_app

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    depends_on:
      - mysql

  nginx:
    image: nginx:latest

    container_name: myapp_nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  mysql:
    image: mysql:8

    container_name: myapp_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: myapp_phpmyadmin

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql

  node:
    image: node:22

    container_name: myapp_node

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    tty: true

volumes:
  mysql_data: